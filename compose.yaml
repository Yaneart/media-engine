name: media-engine-dev

x-node-dev-service: &node-dev-service
  image: node:24-bookworm-slim
  user: "${UID:-1000}:${GID:-1000}"
  working_dir: /workspace
  volumes:
    - .:/workspace
    # Keep the dependency tree on the Linux filesystem. Reading thousands of package files from a
    # Windows bind mount makes every cold Nest/Vite start take minutes.
    - workspace-node-modules:/workspace/node_modules

services:
  workspace-bootstrap:
    <<: *node-dev-service
    restart: "no"
    command:
      - /bin/sh
      - -lc
      - |
        set -eu
        mkdir -p /tmp/corepack-bin
        corepack enable --install-directory /tmp/corepack-bin
        export PATH="/tmp/corepack-bin:$$PATH"

        dependency_hash="$$(sha256sum pnpm-lock.yaml package.json pnpm-workspace.yaml packages/*/package.json apps/*/package.json | sha256sum | cut -d ' ' -f 1)"
        dependency_marker="node_modules/.media-engine-dependency-hash"
        if [ ! -f "$$dependency_marker" ] || [ "$$(cat "$$dependency_marker")" != "$$dependency_hash" ]; then
          pnpm install --frozen-lockfile --force
          printf '%s\n' "$$dependency_hash" > "$$dependency_marker"
        fi

        if [ ! -f packages/core/dist/index.js ] || [ ! -f packages/providers/dist/index.js ] || [ ! -f packages/sdk/dist/index.js ]; then
          pnpm --filter @media-engine/core build
          pnpm --filter @media-engine/providers build
          pnpm --filter @media-engine/sdk build
        fi

  api:
    <<: *node-dev-service
    depends_on:
      workspace-bootstrap:
        condition: service_completed_successfully
    ports:
      - "${MEDIA_ENGINE_COMPOSE_BIND_ADDRESS:-0.0.0.0}:3000:3000"
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}
      MEDIA_ENGINE_RATE_LIMIT_WINDOW_MS: ${MEDIA_ENGINE_RATE_LIMIT_WINDOW_MS:-60000}
      MEDIA_ENGINE_RATE_LIMIT_MAX_REQUESTS: ${MEDIA_ENGINE_RATE_LIMIT_MAX_REQUESTS:-60}
      MEDIA_ENGINE_STREAMING_PROVIDER_TIMEOUT_MS: ${MEDIA_ENGINE_STREAMING_PROVIDER_TIMEOUT_MS:-10000}
      MEDIA_ENGINE_FLIXHQ_STREAMING_PROVIDER_TIMEOUT_MS: ${MEDIA_ENGINE_FLIXHQ_STREAMING_PROVIDER_TIMEOUT_MS:-15000}
      MEDIA_ENGINE_VIDEOHUB_STREAMING_PROVIDER_TIMEOUT_MS: ${MEDIA_ENGINE_VIDEOHUB_STREAMING_PROVIDER_TIMEOUT_MS:-20000}
      MEDIA_ENGINE_FILMIX_STREAMING_ENABLED: ${MEDIA_ENGINE_FILMIX_STREAMING_ENABLED:-false}
      MEDIA_ENGINE_FILMIX_STREAMING_BASE_URL: ${MEDIA_ENGINE_FILMIX_STREAMING_BASE_URL:-}
      MEDIA_ENGINE_FILMIX_STREAMING_TOKEN: ${MEDIA_ENGINE_FILMIX_STREAMING_TOKEN:-}
      MEDIA_ENGINE_FILMIX_STREAMING_ALLOW_INSECURE_HTTP_AUTH: ${MEDIA_ENGINE_FILMIX_STREAMING_ALLOW_INSECURE_HTTP_AUTH:-false}
      MEDIA_ENGINE_VEOVEO_STREAMING_ENABLED: ${MEDIA_ENGINE_VEOVEO_STREAMING_ENABLED:-false}
      MEDIA_ENGINE_VIDEOHUB_STREAMING_ENABLED: ${MEDIA_ENGINE_VIDEOHUB_STREAMING_ENABLED:-false}
      MEDIA_ENGINE_RUTUBE_STREAMING_ENABLED: ${MEDIA_ENGINE_RUTUBE_STREAMING_ENABLED:-false}
      MEDIA_ENGINE_TORRENT_PROVIDERS: ${MEDIA_ENGINE_TORRENT_PROVIDERS:-}
      MEDIA_ENGINE_TORRENT_PROVIDER_TIMEOUT_MS: ${MEDIA_ENGINE_TORRENT_PROVIDER_TIMEOUT_MS:-15000}
      MEDIA_ENGINE_TORRSERVER_URL: ${MEDIA_ENGINE_TORRSERVER_URL:-http://torrserver:8090}
      MEDIA_ENGINE_TORRSERVER_EXPECTED_VERSION: ${MEDIA_ENGINE_TORRSERVER_EXPECTED_VERSION:-MatriX.141}
      MEDIA_ENGINE_TORRSERVER_OWNER_ID: ${MEDIA_ENGINE_TORRSERVER_OWNER_ID:-media-engine-compose}
      MEDIA_ENGINE_TORRSERVER_CONTROL_CONNECT_TIMEOUT_MS: ${MEDIA_ENGINE_TORRSERVER_CONTROL_CONNECT_TIMEOUT_MS:-3000}
      MEDIA_ENGINE_TORRSERVER_CONTROL_REQUEST_TIMEOUT_MS: ${MEDIA_ENGINE_TORRSERVER_CONTROL_REQUEST_TIMEOUT_MS:-10000}
      MEDIA_ENGINE_TORRSERVER_METADATA_TIMEOUT_MS: ${MEDIA_ENGINE_TORRSERVER_METADATA_TIMEOUT_MS:-60000}
      MEDIA_ENGINE_TORRSERVER_METADATA_POLL_INTERVAL_MS: ${MEDIA_ENGINE_TORRSERVER_METADATA_POLL_INTERVAL_MS:-250}
      MEDIA_ENGINE_TORRSERVER_COLD_STREAM_HEADER_TIMEOUT_MS: ${MEDIA_ENGINE_TORRSERVER_COLD_STREAM_HEADER_TIMEOUT_MS:-45000}
      MEDIA_ENGINE_TORRSERVER_COLD_STREAM_INACTIVITY_TIMEOUT_MS: ${MEDIA_ENGINE_TORRSERVER_COLD_STREAM_INACTIVITY_TIMEOUT_MS:-30000}
      MEDIA_ENGINE_TORRSERVER_MAX_TORRENT_BYTES: ${MEDIA_ENGINE_TORRSERVER_MAX_TORRENT_BYTES:-4194304}
      MEDIA_ENGINE_TORRENT_SESSION_TTL_MS: ${MEDIA_ENGINE_TORRENT_SESSION_TTL_MS:-21600000}
      MEDIA_ENGINE_TORRENT_SESSION_TERMINAL_RETENTION_MS: ${MEDIA_ENGINE_TORRENT_SESSION_TERMINAL_RETENTION_MS:-300000}
      MEDIA_ENGINE_TORRENT_SESSION_CLEANUP_INTERVAL_MS: ${MEDIA_ENGINE_TORRENT_SESSION_CLEANUP_INTERVAL_MS:-10000}
      MEDIA_ENGINE_TORRENT_SOURCE_REQUEST_TIMEOUT_MS: ${MEDIA_ENGINE_TORRENT_SOURCE_REQUEST_TIMEOUT_MS:-30000}
      MEDIA_ENGINE_TORRENT_SESSION_MAX_CONCURRENT_CREATIONS: ${MEDIA_ENGINE_TORRENT_SESSION_MAX_CONCURRENT_CREATIONS:-4}
      MEDIA_ENGINE_TORRENT_STREAM_MAX_CONCURRENT: ${MEDIA_ENGINE_TORRENT_STREAM_MAX_CONCURRENT:-8}
      MEDIA_ENGINE_TORRENT_SESSION_CREATION_RATE_LIMIT_WINDOW_MS: ${MEDIA_ENGINE_TORRENT_SESSION_CREATION_RATE_LIMIT_WINDOW_MS:-60000}
      MEDIA_ENGINE_TORRENT_SESSION_CREATION_RATE_LIMIT_MAX_REQUESTS: ${MEDIA_ENGINE_TORRENT_SESSION_CREATION_RATE_LIMIT_MAX_REQUESTS:-10}
      MEDIA_ENGINE_ORIGINAL_TORRENT_TOKEN: ${MEDIA_ENGINE_ORIGINAL_TORRENT_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - original-torrent-runtime
    command: npm --prefix apps/api run start:dev
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 5
      # A cold TypeScript/Nest watch build can take over a minute on Docker Desktop.
      start_period: 120s

  # GPL-3.0 runtime is pinned, has a private API path, and uses a dedicated peer-egress network.
  torrserver:
    image: ghcr.io/yourok/torrserver:MatriX.141.1@sha256:e44f08ec579615a783c3ab45e00595f50e9e5f94810dc06910c201edecd6205b
    environment:
      TS_PORT: 8090
      TS_IP: 0.0.0.0
      TS_RDB: 0
      TS_HTTPAUTH: 0
      TS_CONF_PATH: /opt/ts/config
      TS_LOG_PATH: /tmp/torrserver.log
      TS_TORR_DIR: /opt/ts/torrents
    expose:
      - "8090"
    networks:
      original-torrent-runtime: {}
      torrent-egress:
        gw_priority: 1
    read_only: true
    tmpfs:
      - /opt/ts/torrents:rw,nosuid,nodev,noexec,size=33554432
      - /tmp:rw,nosuid,nodev,noexec,size=67108864
    volumes:
      - torrserver-state:/opt/ts/config
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    pids_limit: 256
    mem_limit: ${MEDIA_ENGINE_TORRSERVER_MEMORY_LIMIT:-1g}
    cpus: ${MEDIA_ENGINE_TORRSERVER_CPUS:-2.0}
    restart: unless-stopped
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "2"
    healthcheck:
      test:
        - CMD-SHELL
        - test "$$(wget -q -O - http://127.0.0.1:8090/echo)" = "MatriX.141"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  example:
    <<: *node-dev-service
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${MEDIA_ENGINE_COMPOSE_BIND_ADDRESS:-0.0.0.0}:5173:5173"
    environment:
      VITE_MEDIA_ENGINE_API_URL: http://127.0.0.1:3000
      MEDIA_ENGINE_ORIGINAL_TORRENT_API_URL: http://api:3000
      MEDIA_ENGINE_ORIGINAL_TORRENT_TOKEN: ${MEDIA_ENGINE_ORIGINAL_TORRENT_TOKEN:-}
    command: npm --prefix apps/example run dev -- --host 0.0.0.0
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:5173').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 5
      # Keep the dependency chain tolerant of a cold Vite/TypeScript startup too.
      start_period: 60s

networks:
  original-torrent-runtime:
    internal: true
  torrent-egress: {}

volumes:
  torrserver-state:
  workspace-node-modules:
